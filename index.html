<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>human-document-tree</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #graph {
        position: absolute;
        top: 0;
        left: 0;
        height: 100vh;
        transition: left 0.28s ease;
      }
      /* Left statistics panel (#43): a docked, collapsible analysis of the
         document's structure — node/edge composition, shape ratios, key terms —
         mirroring the right document sidebar. It also hosts the title and the live
         stats / routing / semantic-status lines (formerly the floating #hud), so
         the whole left rail is one coherent surface. */
      #stats-panel {
        position: fixed;
        top: 0;
        left: 0;
        width: 300px;
        height: 100vh;
        box-sizing: border-box;
        z-index: 9;
        display: flex;
        flex-direction: column;
        padding: 12px 0;
        color: #cfe3ff;
        background: rgba(8, 12, 22, 0.92);
        border-right: 1px solid #1d2740;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 0.28s ease;
      }
      body.stats-collapsed #stats-panel {
        transform: translateX(-100%);
      }
      #stats-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 8px;
        border-bottom: 1px solid #161f33;
      }
      #stats-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #eaf2ff;
      }
      #stats-meta {
        padding: 8px 14px;
        border-bottom: 1px solid #161f33;
        font-size: 12.5px;
        line-height: 1.5;
      }
      #stats-meta .meta {
        opacity: 0.8;
      }
      /* Phase 5 #1 — live elapsed-time readout. Sits at the top of the meta
         block so a slow walk / semantic pass reads as active work (the number
         keeps ticking), then freezes at the total when the build settles.
         Tabular figures so the width doesn't jitter as it counts. */
      #elapsed {
        opacity: 1;
        color: #7aa2ff;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        margin-bottom: 1px;
      }
      #elapsed.running {
        color: #8ad0a8; /* green while work is in flight; cools to blue on freeze */
      }
      #stats-collapse,
      #stats-reopen {
        font: inherit;
        font-size: 16px;
        line-height: 1;
        color: #cfe3ff;
        background: rgba(13, 20, 38, 0.85);
        border: 1px solid #33415c;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
      }
      #stats-collapse:hover,
      #stats-reopen:hover {
        border-color: #7aa2ff;
      }
      #stats-reopen {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 9;
        display: none;
      }
      body.stats-collapsed #stats-reopen {
        display: inline-flex;
      }
      #stats-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px 24px;
        font-size: 12.5px;
        color: #b9c8e6;
      }
      #stats-body .stat-section {
        margin-bottom: 16px;
      }
      #stats-body .stat-h {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7aa2ff;
        margin: 0 0 6px;
        font-weight: 700;
      }
      #stats-body .stat-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
        font-size: 12px;
      }
      #stats-body .stat-swatch {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        flex: none;
      }
      #stats-body .stat-name {
        width: 78px;
        flex: none;
        color: #cdd9f0;
        text-transform: capitalize;
      }
      #stats-body .stat-bar {
        flex: 1;
        height: 6px;
        background: rgba(122, 162, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      #stats-body .stat-bar-fill {
        height: 100%;
        border-radius: 3px;
      }
      #stats-body .stat-count {
        width: 46px;
        flex: none;
        text-align: right;
        color: #9bb0d6;
        font-variant-numeric: tabular-nums;
      }
      #stats-body .stat-metric {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 4px 0;
        font-size: 12px;
      }
      #stats-body .stat-metric .k {
        color: #9bb0d6;
      }
      #stats-body .stat-metric .v {
        color: #eaf2ff;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      #stats-body .stat-prov {
        margin-top: 8px;
        font-size: 11px;
        color: #9bb0d6;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      #stats-body .stat-prov .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }
      #stats-body .stat-terms {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #stats-body .stat-term {
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11.5px;
        color: #cdd9f0;
        background: rgba(139, 92, 246, 0.14);
        border: 1px solid transparent;
      }
      #stats-body .stat-term:hover {
        border-color: #8b5cf6;
        color: #eaf2ff;
      }
      #stats-body .stat-term .deg {
        opacity: 0.55;
        margin-left: 4px;
        font-size: 10px;
      }
      #stats-body .stat-empty {
        opacity: 0.4;
        font-style: italic;
      }
      #controls {
        position: fixed;
        top: 12px;
        right: 14px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #controls input,
      #controls select,
      #controls button {
        font: inherit;
        font-size: 13px;
        color: #cfe3ff;
        background: rgba(13, 20, 38, 0.85);
        border: 1px solid #33415c;
        border-radius: 6px;
        padding: 6px 10px;
        outline: none;
      }
      #controls input::placeholder {
        color: #6b7a99;
      }
      #controls input:focus,
      #controls select:focus {
        border-color: #7aa2ff;
      }
      #controls select {
        cursor: pointer;
      }
      #controls select:hover {
        border-color: #7aa2ff;
      }
      #controls button {
        cursor: pointer;
      }
      #controls button:hover {
        border-color: #7aa2ff;
        background: rgba(26, 38, 64, 0.9);
      }
      /* A toggle button (e.g. Bundle) reads as engaged when active. */
      #controls button.active {
        border-color: #7aa2ff;
        background: rgba(122, 162, 255, 0.22);
        color: #eaf2ff;
      }
      #open-doc {
        font-weight: 600;
      }
      #search-count,
      #meaning-count {
        color: #9bb0d6;
        font-size: 12px;
        min-width: 64px;
      }
      /* B5 routing line under the stats: document class + resolved pipeline, and
         a warm hint when the ideal pipeline wasn't compiled into this build. */
      #routing {
        font-size: 12px;
        margin-top: 1px;
      }
      #routing .cls {
        color: #7aa2ff;
        font-weight: 600;
        text-transform: capitalize;
      }
      #routing .hint {
        color: #f0b86c;
      }
      /* #39 engagement: a gently pulsing line shown while the structural spine is
         on screen but the slow model-backed semantic/embedding pass is still
         running, so the wait reads as active work rather than a hang. */
      #semantic-status {
        font-size: 12px;
        margin-top: 1px;
        color: #f0a6c8; /* warm semantic hue, distinct from the cool routing line */
      }
      #semantic-status .pulse {
        display: inline-block;
        margin-right: 3px;
        animation: semantic-pulse 1.1s ease-in-out infinite;
      }
      @keyframes semantic-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      /* Playback is a compact, faint floating chip so it never competes with the
         animation; it lights up on hover/focus. */
      #playback {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 6px;
        background: rgba(13, 20, 38, 0.55);
        border: 1px solid rgba(51, 65, 92, 0.55);
        border-radius: 999px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        opacity: 0.5;
        transition: opacity 0.25s ease, left 0.28s ease;
      }
      #playback:hover,
      #playback:focus-within {
        opacity: 1;
      }
      #playback button {
        font: inherit;
        font-size: 13px;
        line-height: 1;
        color: #cfe3ff;
        background: transparent;
        border: none;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        outline: none;
      }
      #playback button:hover {
        background: rgba(122, 162, 255, 0.18);
      }
      #build-bar {
        width: 88px;
        height: 4px;
        border-radius: 2px;
        background: rgba(122, 162, 255, 0.18);
        overflow: hidden;
      }
      #build-bar-fill {
        height: 100%;
        width: 0%;
        background: #7aa2ff;
        border-radius: 2px;
        transition: width 0.18s linear;
      }
      #build-progress {
        color: #9bb0d6;
        font-size: 11px;
        white-space: nowrap;
        min-width: 70px;
      }
      /* Speed slider: re-paces the build animation (right = faster). Styled to
         match the chip's thin-track aesthetic in both WebKit and Firefox. */
      #playback input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 72px;
        height: 4px;
        margin: 0;
        border-radius: 2px;
        background: rgba(122, 162, 255, 0.18);
        cursor: pointer;
        outline: none;
      }
      #playback input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #7aa2ff;
        cursor: pointer;
      }
      #playback input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        background: #7aa2ff;
        cursor: pointer;
      }

      /* Full-window drop target hint, shown only while dragging a file over. */
      #drop-hint {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 7, 13, 0.72);
        color: #cfe3ff;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.01em;
        pointer-events: none;
      }
      #drop-hint.active {
        display: flex;
      }
      #drop-hint .box {
        padding: 40px 56px;
        border: 2px dashed #7aa2ff;
        border-radius: 16px;
        background: rgba(13, 20, 38, 0.6);
      }

      .hidden {
        display: none !important;
      }

      /* Phase 5 #4 — saved-graph library modal. A centered panel over a dimming
         backdrop; rows list each saved graph with open / rename / delete. */
      #library-modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #library-modal .lib-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(5, 7, 13, 0.66);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
      }
      #library-modal .lib-panel {
        position: relative;
        width: min(560px, calc(100vw - 48px));
        max-height: min(72vh, 720px);
        display: flex;
        flex-direction: column;
        background: rgba(11, 16, 28, 0.98);
        border: 1px solid #26334d;
        border-radius: 12px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        color: #cfe3ff;
        overflow: hidden;
      }
      #library-modal .lib-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #1d2740;
      }
      #library-modal .lib-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #eaf2ff;
      }
      #library-close {
        font: inherit;
        font-size: 20px;
        line-height: 1;
        color: #9bb0d6;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0 4px;
      }
      #library-close:hover {
        color: #eaf2ff;
      }
      #library-list {
        overflow-y: auto;
        padding: 8px;
      }
      #library-list .lib-empty {
        opacity: 0.55;
        font-style: italic;
        padding: 24px 12px;
        text-align: center;
      }
      #library-list .lib-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
      }
      #library-list .lib-row:hover {
        background: rgba(122, 162, 255, 0.07);
        border-color: #26334d;
      }
      #library-list .lib-row-main {
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }
      #library-list .lib-name {
        font-size: 14px;
        font-weight: 600;
        color: #eaf2ff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #library-list .lib-sub {
        font-size: 11.5px;
        color: #9bb0d6;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
        text-transform: capitalize;
      }
      #library-list .lib-actions {
        display: flex;
        gap: 6px;
        flex: none;
      }
      #library-list .lib-btn {
        font: inherit;
        font-size: 12px;
        color: #cfe3ff;
        background: rgba(13, 20, 38, 0.85);
        border: 1px solid #33415c;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      #library-list .lib-btn:hover {
        border-color: #7aa2ff;
        background: rgba(26, 38, 64, 0.9);
      }
      #library-list .lib-btn.lib-danger:hover {
        border-color: #ff6b6b;
        color: #ffd9d9;
      }

      /* Right sidebar (D3): the document text unfolds here, sentence by sentence,
         as the matching nodes are assimilated into the graph. The 3D canvas is
         narrowed to leave room for it (see layoutGraph in main.ts). */
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 360px;
        height: 100vh;
        box-sizing: border-box;
        z-index: 9;
        display: flex;
        flex-direction: column;
        padding: 52px 0 12px;
        background: rgba(8, 12, 22, 0.92);
        border-left: 1px solid #1d2740;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 0.28s ease;
      }
      body.sidebar-collapsed #sidebar {
        transform: translateX(100%);
      }
      #sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 8px;
        border-bottom: 1px solid #161f33;
        margin-bottom: 6px;
      }
      #sidebar-title {
        color: #cfe3ff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      #sidebar-collapse,
      #sidebar-reopen {
        font: inherit;
        font-size: 16px;
        line-height: 1;
        color: #cfe3ff;
        background: rgba(13, 20, 38, 0.85);
        border: 1px solid #33415c;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
      }
      #sidebar-collapse:hover,
      #sidebar-reopen:hover {
        border-color: #7aa2ff;
      }
      #sidebar-reopen {
        position: fixed;
        right: 12px;
        top: 60px;
        z-index: 9;
        display: none;
      }
      body.sidebar-collapsed #sidebar-reopen {
        display: inline-flex;
      }

      /* Node details (D4) — pinned above the unfolding text when a node is
         clicked: its kind/provenance, its own text, and its connections. */
      #node-details {
        margin: 0 12px 8px;
        padding: 10px 12px;
        background: rgba(13, 20, 38, 0.7);
        border: 1px solid #26334d;
        border-radius: 8px;
        max-height: 42vh;
        overflow-y: auto;
        font-size: 12.5px;
        color: #b9c8e6;
      }
      #node-details .nd-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      #node-details .nd-kind {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 2px 7px;
        border-radius: 999px;
        color: #05070d;
      }
      #node-details .nd-label {
        font-size: 14px;
        font-weight: 600;
        color: #eaf2ff;
        flex: 1;
        word-break: break-word;
      }
      #node-details .nd-prov {
        font-size: 11px;
        opacity: 0.7;
        margin-bottom: 6px;
      }
      #node-details .nd-prov .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }
      #node-details .nd-text {
        font-style: italic;
        color: #cdd9f0;
        background: rgba(122, 162, 255, 0.08);
        border-left: 2px solid #3d5a80;
        padding: 5px 8px;
        border-radius: 0 4px 4px 0;
        margin-bottom: 8px;
      }
      #node-details .nd-conn-group {
        margin-top: 6px;
      }
      #node-details .nd-conn-kind {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.6;
        margin: 4px 0 2px;
      }
      #node-details .nd-conn {
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 4px;
        display: inline-block;
        margin: 1px 3px 1px 0;
        background: rgba(122, 162, 255, 0.08);
        border: 1px solid transparent;
      }
      #node-details .nd-conn:hover {
        border-color: #7aa2ff;
        color: #eaf2ff;
      }
      #node-details .nd-conn .swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }
      #node-details-close {
        font: inherit;
        font-size: 15px;
        line-height: 1;
        color: #9bb0d6;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0 2px;
      }
      #node-details-close:hover {
        color: #eaf2ff;
      }

      #sidebar-doc {
        flex: 1;
        overflow-y: auto;
        padding: 0 14px 24px;
        color: #b9c8e6;
        font-size: 13.5px;
        line-height: 1.7;
      }
      #sidebar-doc .doc-section {
        color: #7aa2ff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 16px 0 6px;
        cursor: pointer;
      }
      #sidebar-doc .doc-section:first-child {
        margin-top: 0;
      }
      #sidebar-doc .doc-para {
        margin: 0 0 12px;
      }
      #sidebar-doc .doc-sentence {
        cursor: pointer;
        border-radius: 3px;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #sidebar-doc .doc-sentence:hover {
        color: #eaf2ff;
        background: rgba(122, 162, 255, 0.1);
      }
      #sidebar-doc .doc-empty {
        opacity: 0.4;
        font-style: italic;
      }
      /* D4 jump-to-text highlight on the clicked node's sentence(s). */
      #sidebar-doc .doc-active {
        background: rgba(122, 162, 255, 0.3);
        color: #ffffff;
        box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <aside id="stats-panel">
      <div id="stats-header">
        <h1 id="stats-title">human-document-tree</h1>
        <button id="stats-collapse" type="button" title="Hide analysis" aria-label="Hide analysis">‹</button>
      </div>
      <div id="stats-meta">
        <div class="meta" id="elapsed"></div>
        <div class="meta" id="stats">loading…</div>
        <div class="meta" id="routing"></div>
        <div class="meta hidden" id="semantic-status"></div>
      </div>
      <div id="stats-body"></div>
    </aside>
    <button id="stats-reopen" type="button" title="Show analysis" aria-label="Show analysis">›</button>
    <div id="controls">
      <select id="layout" title="Layout method" aria-label="Layout method">
        <option value="force3d">Force · 3D</option>
        <option value="force2d">Force · 2D map</option>
        <option value="layers">Layers · by structure</option>
      </select>
      <button
        id="bundle"
        type="button"
        title="Bundle edges into trails (curved routing by structure)"
        aria-pressed="false"
      >
        Bundle
      </button>
      <input
        id="search"
        type="search"
        placeholder="Search nodes…"
        autocomplete="off"
        spellcheck="false"
      />
      <span id="search-count"></span>
      <input
        id="meaning-search"
        class="hidden"
        type="search"
        placeholder="Find by meaning…"
        title="Rank nodes by embedding similarity (press Enter)"
        autocomplete="off"
        spellcheck="false"
      />
      <span id="meaning-count" class="hidden"></span>
      <button id="save-doc" type="button" class="hidden" title="Save this graph to the library">Save</button>
      <button id="library" type="button" class="hidden" title="Open the saved-graph library">Library</button>
      <button id="open-doc" type="button">Open document</button>
      <button id="reset" type="button">Reset view</button>
    </div>
    <input
      id="file-input"
      type="file"
      accept=".txt,.md,.markdown,.pdf,text/plain,text/markdown,application/pdf"
      hidden
    />
    <div id="playback">
      <button id="playpause" type="button" title="Play / Pause" aria-label="Play / Pause">⏸</button>
      <button id="replay" type="button" title="Replay build" aria-label="Replay build">⟳</button>
      <div id="build-bar"><div id="build-bar-fill"></div></div>
      <span id="build-progress"></span>
      <input
        id="speed"
        type="range"
        min="0"
        max="100"
        value="0"
        title="Build speed (drag right = faster)"
        aria-label="Build speed"
      />
    </div>
    <div id="drop-hint"><div class="box">Drop a .txt, .md, or .pdf document to visualize</div></div>
    <!-- Phase 5 #4 (ADR-0007): the saved-graph library. Desktop-only (revealed
         when running in the Tauri shell); lists persisted graphs with open /
         rename / delete. Opening one restores the exact saved layout instantly,
         with no re-walk. -->
    <div id="library-modal" class="hidden">
      <div class="lib-backdrop" id="library-backdrop"></div>
      <div class="lib-panel" role="dialog" aria-label="Saved graphs">
        <div class="lib-header">
          <span class="lib-title">Saved graphs</span>
          <button id="library-close" type="button" title="Close (Esc)" aria-label="Close">×</button>
        </div>
        <div id="library-list" class="lib-list"></div>
      </div>
    </div>
    <aside id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">Document</span>
        <button id="sidebar-collapse" type="button" title="Hide document" aria-label="Hide document">›</button>
      </div>
      <div id="node-details" class="hidden"></div>
      <div id="sidebar-doc"><div class="doc-empty">walking…</div></div>
    </aside>
    <button id="sidebar-reopen" type="button" title="Show document" aria-label="Show document">‹</button>
    <div id="graph"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
