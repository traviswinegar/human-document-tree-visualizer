<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>human-document-tree</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #graph {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 14px;
        z-index: 10;
        color: #cfe3ff;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #hud h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #hud .meta {
        opacity: 0.7;
      }
      #controls {
        position: fixed;
        top: 12px;
        right: 14px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #controls input,
      #controls button {
        font: inherit;
        font-size: 13px;
        color: #cfe3ff;
        background: rgba(13, 20, 38, 0.85);
        border: 1px solid #33415c;
        border-radius: 6px;
        padding: 6px 10px;
        outline: none;
      }
      #controls input::placeholder {
        color: #6b7a99;
      }
      #controls input:focus {
        border-color: #7aa2ff;
      }
      #controls button {
        cursor: pointer;
      }
      #controls button:hover {
        border-color: #7aa2ff;
        background: rgba(26, 38, 64, 0.9);
      }
      #search-count {
        color: #9bb0d6;
        font-size: 12px;
        min-width: 64px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>human-document-tree</h1>
      <div class="meta" id="stats">loading fixture…</div>
    </div>
    <div id="controls">
      <input
        id="search"
        type="search"
        placeholder="Search nodes…"
        autocomplete="off"
        spellcheck="false"
      />
      <span id="search-count"></span>
      <button id="reset" type="button">Reset view</button>
    </div>
    <div id="graph"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
