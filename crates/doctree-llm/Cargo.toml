[package]
name = "doctree-llm"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Gated local-LLM semantic layer for human-document-tree (ADR-0001 decoupling)."

[features]
# Default is native-free: the crate compiles and tests with ZERO native deps so
# `cargo test` (and the whole default workspace build) runs anywhere. The engine
# itself is gated behind `llm`. This is the load-bearing decoupling invariant
# from ADR-0001 — a failed CUDA/native build must never block Stream A.
default = []
# Pull in the momusdev_llm engine with CPU inference (llama-cpp-2). Needs a C++
# toolchain (MSVC + CMake) on PATH to build the native llama.cpp.
llm = ["dep:momusdev_llm", "momusdev_llm/inference"]
# GPU backends — each implies `llm` and cascades to the matching momusdev_llm /
# llama-cpp-2 feature. Pick at most one per build (mutually exclusive at link).
cuda = ["llm", "momusdev_llm/cuda"]
vulkan = ["llm", "momusdev_llm/vulkan"]
# Embeddings (all-MiniLM-L6-v2 via fastembed/ONNX) for similarity edges + search
# (B4) AND the cross-document persistent RAG store (Phase 6 #7 / ADR-00010 — the
# on-disk LanceDB corpus via momusdev_llm's `VectorStore`). Independent of `llm`:
# this turns on the embedder + store (downloaded ORT binary, no C++ toolchain)
# WITHOUT compiling llama.cpp, so a build can do embeddings alone, inference
# alone, or both. Heavy deps (lancedb/arrow/fastembed) but no native compiler
# beyond what `cargo` links. `dep:tokio` is the runtime the sync `RagStore`
# wrapper drives the async `VectorStore` with — gated here, never in the default.
vectordb = ["dep:momusdev_llm", "momusdev_llm/vectordb", "dep:tokio"]

[dependencies]
doctree-core = { path = "../doctree-core" }
anyhow.workspace = true

# The local-LLM engine — OPTIONAL + default-features=false so the dependency graph
# stays native-free unless a feature above turns it on (ADR-0001). The committed path
# points at an in-repo BUILD STUB (vendor/momusdev_llm) so a fresh public clone
# resolves and builds native-free WITHOUT the private engine (ADR-00016). Build the
# real llm/vectordb features by overriding the stub with the real crate locally via
# `.cargo/config.toml` `paths` (see .cargo/config.toml.example). The engine is
# consumed read-only, never modified.
momusdev_llm = { path = "../../vendor/momusdev_llm", optional = true, default-features = false }

# Tokio runtime for the sync `RagStore` wrapper to drive the async LanceDB
# `VectorStore` via `block_on`. Optional + only in the `vectordb` feature, so the
# native-free default never pulls it (ADR-0001). `momusdev_llm` already enables
# the rt/time/io features when `vectordb` is on; `rt-multi-thread` lets
# `Runtime::new()` build a full runtime here.
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
# Test-only: the live extraction test deserializes the model's JSON back into the
# schema to prove it is schema-valid by construction. Pure Rust (no native deps),
# so it never touches the ADR-0001 runtime decoupling invariant.
serde_json.workspace = true
