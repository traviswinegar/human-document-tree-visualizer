# Cargo workspace root for human-document-tree.
# Members are added as they are created (a workspace with a missing member fails
# to load). src-tauri arrives in a later step.
[workspace]
resolver = "2"
members = ["crates/doctree-core", "crates/doctree-llm", "crates/doctree-wasm", "crates/corpus-export", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
