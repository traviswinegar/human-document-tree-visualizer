# Cargo workspace root for human-document-tree.
# Members are added as they are created (a workspace with a missing member fails
# to load). doctree-llm (gated, native) and src-tauri arrive in later steps.
[workspace]
resolver = "2"
members = ["crates/doctree-core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
